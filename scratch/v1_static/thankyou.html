<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Havora Waitlist</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-thankyou d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 540px;">
        <div class="thankyou-card text-center p-4 p-md-5 bg-white rounded-4 shadow-lg border">
            <div class="heart-badge-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 72px; height: 72px; background: rgba(21,130,101,0.1); border-radius: 50%;">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="#158265"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>

            <h1 class="thank-title display-5 fw-bold mb-3 text-dark">Thank You!</h1>
            <p class="thank-desc text-muted mb-4 fs-5">
                Your response has been saved. <br>
                Together, we'll build meaningful connections for Africans worldwide.
            </p>

            <div class="queue-badge p-3 rounded-3 mb-4" style="background: #F7F1E5; border: 1px solid #B98D44;">
                <span class="queue-label fw-bold text-uppercase d-block mb-1" style="color: #B98D44; font-size: 0.8rem; letter-spacing: 0.08em;">YOUR WAITLIST SPOT</span>
                <div class="queue-number display-4 fw-bold" style="color: #158265; font-family: 'Playfair Display', serif;">#04,392</div>
            </div>

            <div class="thank-action mt-4">
                <a href="index.html" class="btn btn-teal-filled w-100 py-3 fw-bold fs-5 text-decoration-none">Go back to home page &rarr;</a>
            </div>
        </div>
    </div>

</body>
</html>
